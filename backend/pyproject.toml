[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# B008: FastAPI's Depends()/Query()/etc. are designed to be called in argument
# defaults; this is the framework's required pattern, not a bug.
ignore = ["B008"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
